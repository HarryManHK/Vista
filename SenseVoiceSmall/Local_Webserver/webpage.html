<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Speech-to-Text</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 400px;">
            <h1 class="text-center mb-4">Speech to Text Streaming</h1>

            <div class="d-flex justify-content-center mb-3">
                <!-- Start/Stop Buttons -->
                <button id="startRecording" class="btn btn-primary btn-lg me-2">Start Recording</button>
                <button id="stopRecording" class="btn btn-danger btn-lg" disabled>Stop Recording</button>
            </div>

            <div id="transcription" class="text-center mt-3"></div>
        </div>
    </div>

    <!-- Include Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const startButton = document.getElementById('startRecording');
        const stopButton = document.getElementById('stopRecording');
        const transcriptionDiv = document.getElementById('transcription');

        let mediaRecorder;
        let audioChunks = [];
        let stream;

        // Start recording when the start button is clicked
        startButton.addEventListener('click', async () => {
            // Get access to the microphone
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = event => {
                audioChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const base64Audio = await convertBlobToBase64(audioBlob);
                sendAudioToServer(base64Audio);
            };

            mediaRecorder.start();
            startButton.disabled = true;
            stopButton.disabled = false;
        });

        // Stop recording when the stop button is clicked
        stopButton.addEventListener('click', () => {
            mediaRecorder.stop();
            stream.getTracks().forEach(track => track.stop()); // Stop audio tracks
            startButton.disabled = false;
            stopButton.disabled = true;
        });

        // Convert audio blob to base64 string
        function convertBlobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]); // Extract base64 string
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        // Send audio (base64) to the backend API
        async function sendAudioToServer(base64Audio) {
            const data = {
                wav: base64Audio
            };

            try {
                const response = await fetch('http://localhost:2002/asr', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.code === 0) {
                    transcriptionDiv.innerHTML = `<p class="text-success">Transcription: ${result.res}</p>`;
                } else {
                    transcriptionDiv.innerHTML = `<p class="text-danger">Error: ${result.msg}</p>`;
                }
            } catch (error) {
                transcriptionDiv.innerHTML = `<p class="text-danger">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
